mode: live # Should reflect the actual mode, but ENV vars take precedence normally
api_key: "REPLACE_WITH_YOUR_API_KEY" # Should be loaded from ENV/ .env
api_secret: "REPLACE_WITH_YOUR_API_SECRET" # Should be loaded from ENV/ .env
use_testnet: false                  # <<< THIS MUST BE FALSE FOR LIVE TRADING
leverage: 5
risk_per_trade_percent: 1.5
max_trades_per_day: 6
min_trades_per_day: 2
max_daily_loss_percent: 5.0
symbols: ["BTCUSDT", "ETHUSDT"] # Hãy chắc chắn các symbol này hợp lệ trên sàn LIVE
timeframe: "5m"
strategy: scalping_trend
volatility_tuning: ATR
ema_fast: 9
ema_slow: 21
rsi_period: 14
rsi_overbought: 80
rsi_oversold: 20
volume_mult: 1.0
atr_period: 14
atr_sl_multiplier: 1.5
atr_tp_multiplier: 2.0
cooldown_seconds: 90
scan_interval_seconds: 20
top_volume_count: 20
klines_limit: 150 # Increased for more historical data
min_klines_for_indicators: 30 # Minimum bars needed for indicators
log_level: DEBUG
paper_mode: false
order_usd: 25
