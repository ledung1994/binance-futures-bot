mode: live
api_key: "REPLACE_WITH_YOUR_API_KEY"
api_secret: "REPLACE_WITH_YOUR_API_SECRET"
use_testnet: false
leverage: 5
risk_per_trade_percent: 1.5
max_trades_per_day: 6
min_trades_per_day: 2
symbols: ["BTCUSDT"] # Các cặp giao dịch bạn muốn theo dõi
timeframe: 5 # Khung thời gian chính cho tín hiệu
strategy: scalping_trend
volatility_tuning: ATR
kill_switch_enabled: true
log_level: INFO
initial_balance_usd: 1000 # Giá trị ban đầu của ví (cho tính toán rủi ro)
# Binance futures endpoints
endpoint: https://fapi.binance.com
# Các tham số cho indicator (có thể tùy chỉnh)
ema_fast: 9
ema_slow: 21
rsi_period: 14
rsi_overbought: 70
rsi_oversold: 30
volume_mult: 1.3 # Hệ số nhân khối lượng so với SMA để lọc tín hiệu
# Các tham số rủi ro
atr_period: 14
atr_sl_multiplier: 1.5 # Multiplier cho SL theo ATR
atr_tp_multiplier: 2.0 # Multiplier cho TP theo ATR
# Các tham số khác
cooldown_seconds: 120 # Thời gian chờ giữa các lệnh
scan_interval_seconds: 30 # Khoảng thời gian quét tín hiệu
top_volume_count: 20 # Số lượng coin top có volume để quét
